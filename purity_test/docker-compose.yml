version: '3'

services:
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    environment:
      - DYNAMODB_LOCAL=true

  setup-db:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      aws dynamodb create-table --table-name YalePurityTest --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000;
      
      # Add some sample data
      aws dynamodb put-item --table-name YalePurityTest --item '{\"id\":{\"S\":\"test-id-1\"},\"timestamp\":{\"S\":\"2023-08-01T12:00:00\"},\"score\":{\"N\":\"75\"},\"demographics\":{\"M\":{\"year\":{\"S\":\"2024\"},\"college\":{\"S\":\"Berkeley\"},\"gender\":{\"S\":\"Male\"},\"social_club\":{\"S\":\"Sigma Chi\"}}},\"yes_answers\":{\"L\":[{\"N\":\"0\"},{\"N\":\"5\"},{\"N\":\"10\"},{\"N\":\"15\"},{\"N\":\"20\"},{\"N\":\"25\"},{\"N\":\"30\"},{\"N\":\"35\"},{\"N\":\"40\"},{\"N\":\"45\"},{\"N\":\"50\"},{\"N\":\"55\"},{\"N\":\"60\"},{\"N\":\"65\"},{\"N\":\"70\"},{\"N\":\"75\"},{\"N\":\"80\"},{\"N\":\"85\"},{\"N\":\"90\"},{\"N\":\"95\"},{\"N\":\"99\"}]}}' --endpoint-url http://dynamodb-local:8000;
      
      aws dynamodb put-item --table-name YalePurityTest --item '{\"id\":{\"S\":\"test-id-2\"},\"timestamp\":{\"S\":\"2023-08-01T12:30:00\"},\"score\":{\"N\":\"85\"},\"demographics\":{\"M\":{\"year\":{\"S\":\"2023\"},\"college\":{\"S\":\"Saybrook\"},\"gender\":{\"S\":\"Female\"}}},\"yes_answers\":{\"L\":[{\"N\":\"10\"},{\"N\":\"20\"},{\"N\":\"30\"},{\"N\":\"40\"},{\"N\":\"50\"},{\"N\":\"60\"},{\"N\":\"70\"},{\"N\":\"80\"},{\"N\":\"90\"},{\"N\":\"95\"},{\"N\":\"96\"},{\"N\":\"97\"},{\"N\":\"98\"},{\"N\":\"99\"}]}}' --endpoint-url http://dynamodb-local:8000;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    environment:
      - TABLE_NAME=YalePurityTest
      - DYNAMODB_LOCAL_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - dynamodb-local
      - setup-db 